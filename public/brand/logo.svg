<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none">
  <!-- Building motif -->
  <g>
    <!-- Building bars -->
    <rect x="4" y="20" width="6" height="36" rx="1" fill="#1a2744"/>
    <rect x="14" y="12" width="6" height="44" rx="1" fill="#1a2744"/>
    <rect x="24" y="4" width="6" height="52" rx="1" fill="#1a2744"/>
    <rect x="34" y="16" width="6" height="40" rx="1" fill="#1a2744"/>
    <!-- Orange helmet accent -->
    <path d="M12 8 Q20 -2 28 8" stroke="#e8742a" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  </g>
  <!-- Wordmark -->
  <text x="52" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="700" fill="#1a2744" letter-spacing="-0.5">JOUISSANCE</text>
  <!-- Descriptor -->
  <text x="52" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#6b7a8d" letter-spacing="3">TRAVAUX DIVERS</text>
